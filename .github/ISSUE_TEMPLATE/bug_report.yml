name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15, iOS 17.5
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: How do you open the app?
      options:
        - From the home screen icon
        - In a Safari tab
        - Other browser
    validations:
      required: true
